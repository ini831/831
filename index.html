<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>雨中的相遇 - 想见你</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0f14; }
        .rain { position: absolute; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .drop { position: absolute; width: 1px; height: 15px; background: rgba(200, 200, 255, 0.3); animation: fall linear infinite; }
        @keyframes fall { to { transform: translateY(100vh); } }

        .content { position: relative; z-index: 2; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; text-align: center; cursor: pointer; }
        
        #title { font-size: 2.5rem; letter-spacing: 15px; margin-bottom: 20px; overflow: hidden; white-space: nowrap; border-right: 3px solid #fff; animation: blink 0.75s step-end infinite; }
        @keyframes blink { 50% { border-color: transparent; } }

        /* 时间戳样式 */
        #timestamp {
            position: fixed; left: 20px; bottom: 20px;
            font-family: 'Courier New', monospace; color: #555;
            font-size: 0.9rem; letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="rain" id="rain-container"></div>
    
    <div id="timestamp">1998 / 06 / 12 - 00:00:00</div>

    <div class="content" onclick="playAudio()">
        <h1 id="title"></h1>
        <p id="sub-text"></p>
    </div>

    <audio id="bg-audio" loop>
        <source src="https://www.w3schools.com/howto/rain.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 1. 雨滴效果 (保持不变)
        const container = document.getElementById('rain-container');
        for (let i = 0; i < 100; i++) {
            const drop = document.createElement('div');
            drop.className = 'drop';
            drop.style.left = Math.random() * 100 + '%';
            drop.style.animationDuration = (Math.random() * 0.5 + 0.5) + 's';
            drop.style.animationDelay = Math.random() * 2 + 's';
            container.appendChild(drop);
        }

        // 2. 时间流动效果
        setInterval(() => {
            const now = new Date();
            const year = 1998 + Math.floor(Math.random() * 25); // 在1998年到2023年间跳动
            const timeStr = `${year} / ${String(now.getMonth()+1).padStart(2, '0')} / ${String(now.getDate()).padStart(2, '0')} - ${now.toTimeString().split(' ')[0]}`;
            document.getElementById('timestamp').innerText = timeStr;
        }, 100);

        // 3. 打字机效果
        function typeWriter(text, element, speed) {
            let i = 0;
            function typing() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(typing, speed);
                }
            }
            typing();
        }
        typeWriter("雨和你", document.getElementById('title'), 200);
        setTimeout(() => typeWriter("穿过时间，我只为了寻找那个雨天。", document.getElementById('sub-text'), 100), 1500);

        function playAudio() { document.getElementById('bg-audio').play(); }
    </script>
</body>
</html>
