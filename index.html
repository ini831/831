<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>雨中的相遇 - 想见你</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0f14; }
        
        /* 雨滴效果层 */
        .rain { position: absolute; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .drop { position: absolute; width: 1px; height: 15px; background: rgba(200, 200, 255, 0.3); animation: fall linear infinite; }

        @keyframes fall { to { transform: translateY(100vh); } }

        /* 内容容器 */
        .content { 
            position: relative; z-index: 2; height: 100vh; display: flex; 
            flex-direction: column; justify-content: center; align-items: center;
            color: #fff; text-align: center;
        }

        h1 { font-size: 2.5rem; letter-spacing: 15px; margin-bottom: 20px; }
        .quote { font-family: serif; font-size: 1.2rem; opacity: 0.7; cursor: pointer; transition: 0.3s; }
        .quote:hover { opacity: 1; text-shadow: 0 0 10px #fff; }
    </style>
</head>
<body>

    <div class="rain" id="rain-container"></div>
    
    <div class="content">
        <h1>雨 中 的 想 见</h1>
        <p class="quote" id="text">"雨停了，你还是没来。"</p>
    </div>

    <script>
        // 生成雨滴
        const container = document.getElementById('rain-container');
        for (let i = 0; i < 100; i++) {
            const drop = document.createElement('div');
            drop.className = 'drop';
            drop.style.left = Math.random() * 100 + '%';
            drop.style.animationDuration = (Math.random() * 0.5 + 0.5) + 's';
            drop.style.animationDelay = Math.random() * 2 + 's';
            container.appendChild(drop);
        }

        // 切换台词
        const text = document.getElementById('text');
        const phrases = [
            "雨停了，你还是没来。",
            "其实，只要我想见你，我就一定能见到你。",
            "那是我们第一次在雨中相遇的场景。",
            "穿过时间，我只为了寻找那个雨天。"
        ];
        text.onclick = () => {
            text.innerText = phrases[Math.floor(Math.random() * phrases.length)];
        };
    </script>
</body>
</html>
